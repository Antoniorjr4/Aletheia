name: Fogo real (Groq)

# Executa o athc e a métrica M1 contra um modelo real numa API compatível com OpenAI.
# A chave fica no segredo de repositório GROQ_API_KEY; nada dela entra em logs ou journals.
# Disparo: aba Actions → "Fogo real (Groq)" → Run workflow, ou um push de tag `live-*`.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Modelo: auto (primeiro liberado no projeto), openai/gpt-oss-120b, openai/gpt-oss-20b ou qwen/qwen3.8-27b"
        default: "auto"
      reps:
        description: "Repetições por cenário da M1"
        default: "2"
  push:
    tags: ["live-*"]

# Um só grupo para todos os workflows que gastam na Groq: nunca duas rodadas pagas ao mesmo
# tempo (Rev10, regra 9).
concurrency:
  group: groq-paid
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    # pipefail: `athc … | tee` precisa falhar quando o athc falha
    shell: bash

jobs:
  live:
    name: athc + M1 contra modelo real
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_BASE_URL: https://api.groq.com/openai/v1
      MODEL_INPUT: ${{ inputs.model || 'auto' }}
      REPS: ${{ inputs.reps || '2' }}
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: segredo GROQ_API_KEY
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::defina o segredo de repositório GROQ_API_KEY (Settings → Secrets and variables → Actions)"
            exit 1
          fi
      - name: permissões de modelo na Groq
        run: python3 bench/m1/probe.py --pick "$MODEL_INPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: athc run contra o modelo real (injeção nos logs)
        run: |
          mkdir -p live
          cargo run --release --bin athc -- run examples/remediate.ath --provider openai --model "$ALETHEIA_MODEL" \
            --arg '"api"' --journal live/journal.jsonl --report live/report.json | tee live/run.txt
      - name: auditar o journal (cadeia de hashes e T9)
        run: ./target/release/athc verify-journal live/journal.jsonl | tee -a live/run.txt
      - name: M1 ao vivo
        run: python3 bench/m1/run.py --live --reps "$REPS" --athc target/release/athc --out live/m1
      - name: registros brutos (journal, amostras, chamadas)
        if: always()
        run: python3 bench/m1/dump.py live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-${{ github.run_id }}
          path: live
