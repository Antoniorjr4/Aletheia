name: CI

on:
  push:
    branches: [main, rev7-dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # python3 também roda nos testes diferenciais (crates/athc/tests/differential.rs):
      # o código emitido por `athc emit --target py` precisa produzir o mesmo journal do ARX
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test (inclui os testes diferenciais ARX × Python)
        run: cargo test --all
      - name: aletheia_runtime (testes de unidade)
        working-directory: runtimes/python
        run: PYTHONPATH=. python3 -m unittest discover -s tests -v
      - name: AgentDojo adapter (testes offline sem efeitos)
        run: python3 -m unittest discover -s bench/agentdojo/tests -v

  lean:
    # O núcleo λ_Ath mecanizado: T1 (preservação e progresso, com capacidades lineares e
    # orçamento graduado), T2 (Cap[E] no avaliador instrumentado) e T3 (não-interferência robusta). `--wfail` reprova
    # qualquer aviso, inclusive "declaration uses 'sorry'". O alvo Audit fixa o conjunto de
    # axiomas de cada teorema principal.
    name: provas Lean 4 (T1 · T2 · T3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ hashFiles('lean/lean-toolchain') }}
      - name: elan e o toolchain fixado em lean-toolchain
        run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: lake build (provas + auditoria de axiomas)
        run: lake build --wfail

  m1:
    name: métrica M1 (injeção de prompt)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build athc
        run: cargo build --release --bin athc
      - name: run M1 harness
        # Falha se o Aletheia executar qualquer ação fora da política,
        # se o porte ingênuo compilar ou se o agente deixar de compilar.
        run: python3 bench/m1/run.py --athc target/release/athc --out bench/m1/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-results
          path: bench/m1/results
