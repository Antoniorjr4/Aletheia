name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --all

  m1:
    name: métrica M1 (injeção de prompt)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build athc
        run: cargo build --release --bin athc
      - name: run M1 harness
        # Falha se o Aletheia executar qualquer ação fora da política,
        # se o porte ingênuo compilar ou se o agente deixar de compilar.
        run: python3 bench/m1/run.py --athc target/release/athc --out bench/m1/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-results
          path: bench/m1/results
