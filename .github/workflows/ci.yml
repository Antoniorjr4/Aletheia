name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # python3 também roda nos testes diferenciais (crates/athc/tests/differential.rs):
      # o código emitido por `athc emit --target py` precisa produzir o mesmo journal do ARX
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # sem o binário do Lean, o tripé confere só ARX × Python; o job `tripod` exige os três
      - name: cargo test (inclui os testes diferenciais ARX × Python)
        run: cargo test --all
      - name: aletheia_runtime (testes de unidade)
        working-directory: runtimes/python
        run: PYTHONPATH=. python3 -m unittest discover -s tests -v
      - name: AgentDojo adapter (testes offline sem efeitos)
        run: python3 -m unittest discover -s bench/agentdojo/tests -v
      - name: oráculos da M1 (régua canônica da Rev6 congelada + contextual da Rev7)
        run: python3 -m unittest discover -s bench/m1/tests -v

  agentdojo:
    # A ponte AgentDojo × Aletheia contra o pacote oficial, offline: modelo roteirizado e uma
    # API compatível local. Nenhuma chamada sai para a rede e nenhuma cota é gasta.
    name: AgentDojo oficial (ponte, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: athc e o pacote oficial
        run: |
          cargo build --release --bin athc
          ./target/release/athc check bench/agentdojo/banking.ath
          python3 -m pip install --quiet "agentdojo==0.1.35"
      - name: testes da ponte (suíte banking v1.2.2)
        run: python3 -m unittest discover -s bench/agentdojo/tests -v
      # Eixo II (Rev11): o oráculo comprometido, separado do benchmark oficial. Falha se uma
      # ação proibida produzir efeito, se um controle legítimo for recusado ou se um resíduo
      # documentado mudar de comportamento.
      - name: matriz adversarial (oráculo comprometido, offline)
        run: python3 bench/adversarial/harness.py --athc target/release/athc --out /tmp/adversarial
      # Rev12 (M4): os contratos `requires` contra o mesmo oráculo, com a política oficial e com
      # a que aceita tudo (RS1). Falha se um efeito proibido acontecer ou um controle for recusado.
      - name: contratos de autorização (oráculo comprometido, offline)
        run: python3 bench/adversarial/harness.py --contracts --athc target/release/athc --out /tmp/adversarial
      # v1.0-RC1: autorização por concessão. Sugestão ≠ concessão (sem produto cartesiano),
      # delegação ≠ endosso, uma concessão vale um efeito. Sem chamada paga.
      - name: concessões (oráculo comprometido, offline)
        run: python3 bench/adversarial/harness.py --grants --athc target/release/athc --out /tmp/adversarial

  rc-smoke:
    # v1.0-RC1 ponta a ponta: o programa examples/rc1/treasury.ath contra o serviço local
    # (SQLite), com SIGKILL real e `athc recover` em outro processo. Modelo roteirizado; nenhuma
    # chamada paga, nenhum segredo.
    name: v1.0-RC1 (ponta a ponta, SIGKILL e recuperação)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: scripts/rc-smoke.sh
        run: NO_COLOR=1 scripts/rc-smoke.sh
      # v1.0-RC2: a fronteira entre autorização, persistência e efeito. SIGKILL entre a
      # autorização e a intenção, quatro processos disputando as mesmas concessões, um executor
      # por WAL, e concessões / fotografia / pedido sem a assinatura da autoridade declarada.
      - name: scripts/rc2-smoke.sh
        run: NO_COLOR=1 scripts/rc2-smoke.sh
      # v1.0-RC3: autoridade durável. Registro de consumo encadeado e ancorado (retrocesso,
      # bifurcação e adulteração recusados, inclusive na recuperação), SIGKILL entre o consumo e
      # a âncora, e fontes de autoridade com programa, execução e prazo.
      - name: scripts/rc3-smoke.sh
        run: NO_COLOR=1 scripts/rc3-smoke.sh
      # v1.0-RC4: autoridade temporal e ciclo de vida verificado. Tempo autenticado (relógio
      # local manipulado, repetição, retrocesso, atraso, congelamento), revalidação na fronteira,
      # desfechos ancorados com recibo, liberação da operação provadamente não enviada, e o
      # limite do provedor opaco preservado.
      - name: scripts/rc4-smoke.sh
        run: NO_COLOR=1 scripts/rc4-smoke.sh

  lean:
    # O núcleo λ_Ath mecanizado: T1 (preservação e progresso, com capacidades lineares e
    # orçamento graduado), T2 (Cap[E] linear no avaliador canônico) e T3 (não-interferência robusta). `--wfail` reprova
    # qualquer aviso, inclusive "declaration uses 'sorry'". O alvo Audit fixa o conjunto de
    # axiomas de cada teorema principal.
    name: provas Lean 4 (T1 · T2 · T3 · T6 · T9)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ hashFiles('lean/lean-toolchain') }}
      - name: elan e o toolchain fixado em lean-toolchain
        run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: lake build (provas + auditoria de axiomas + ath-lean-eval)
        run: lake build --wfail
      # o avaliador formal compilado: o 3º backend do tripé diferencial
      - uses: actions/upload-artifact@v4
        with:
          name: ath-lean-eval
          path: lean/.lake/build/bin/ath-lean-eval
          retention-days: 3

  tripod:
    # O tripé diferencial: para programas gerados do núcleo λ_Ath (bem tipados e lineares, com
    # e sem sagas, com e sem chamadas com chave) e para a injeção da Groq de Examples.lean, o
    # avaliador do Lean (o `eval` dos teoremas), o ARX (Rust) e o aletheia_runtime (Python)
    # produzem o mesmo journal do núcleo, byte a byte, inclusive as falhas de pós-condição, as
    # compensações e as sondas. Com chaves, Lean × ARX coincidem módulo a renomeação bijetiva
    # das chaves, e os testes de mutação conferem que a normalização não esconde defeito.
    # Aqui a ausência do binário do Lean é falha (ATH_REQUIRE_LEAN).
    name: tripé diferencial (Lean × ARX × Python)
    runs-on: ubuntu-latest
    needs: lean
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: ath-lean-eval
          path: lean-bin
      - name: cargo test --test differential (com o Lean)
        run: |
          chmod +x lean-bin/ath-lean-eval
          ATH_LEAN_EVAL="$PWD/lean-bin/ath-lean-eval" ATH_REQUIRE_LEAN=1 ATH_TRIPOD_N=400 ATH_SAGA_N=400 \
            ATH_KEYED_N=600 ATH_MUTANT_N=200 cargo test -p athc --test differential -- --nocapture

  m1:
    name: métrica M1 (injeção de prompt)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build athc
        run: cargo build --release --bin athc
      - name: run M1 harness
        # Falha se o Aletheia executar qualquer ação fora da política,
        # se o porte ingênuo compilar ou se o agente deixar de compilar.
        run: python3 bench/m1/run.py --athc target/release/athc --out bench/m1/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-results
          path: bench/m1/results
