name: Rev7 one-shot rustfmt and CI gate
on:
  push:
    branches: [rev7-dev]
    paths: [.github/workflows/rev7-format.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rev7-dev
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Formatar Rust integralmente
        run: cargo fmt --all
      - name: Commitar apenas alterações automáticas do formatter
        run: |
          git config user.name "Aletheia-Lab CI"
          git config user.email "aletheia-lab-ci@users.noreply.github.com"
          git add crates
          git diff --cached --quiet && exit 0
          git commit -m "Rev7: canonical rustfmt for trusted snapshot and contextual policy"
          git push origin HEAD:rev7-dev
