name = "aletheia"
version = "0.1.0"
defaultTargets = ["Aletheia", "Audit", "ath-lean-eval"]

[[lean_lib]]
name = "Aletheia"

# auditoria: fixa o conjunto de axiomas de cada teorema (falha com `sorry`)
[[lean_lib]]
name = "Audit"
roots = ["Aletheia.Axioms"]

# o avaliador formal como 3º backend executável dos testes diferenciais
[[lean_exe]]
name = "ath-lean-eval"
root = "Main"
